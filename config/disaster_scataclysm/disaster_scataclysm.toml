# Disasters Cataclysm configuration

[global]
autoCall = true
maxActiveDisasters = 1
doBlockBreak = true
doPlayerDamage = true
doMobDamage = true

[meteorite]
enabled = true
chance = 0.004
cooldownTicks = 2400
minDistanceFromPlayer = 10
maxDistanceFromPlayer = 30
